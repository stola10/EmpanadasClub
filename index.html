  if(!rows.length){flash("Aucune valeur saisie : rien n’a été modifié.");return}

function calc(l,r,now,M){const o=calc0(l,r,now,M);if(!r)return o;const D=delInfo(l.store);if(!D)return o;
  const d0=new Date(new Date(now).toDateString()).getTime(),n=Math.max(D.next,d0),dn=Math.max(0,(n-now)/DAY);o.next=D.next;o.late=D.next<d0;o.dn=Math.round(dn);
  const after=n+(D.dd+MARGE_J)*DAY,H=l.group==="per"&&o.T?Math.min(after,o.T):after; // marge de sécurité : la livraison peut avoir 1 ou 2 jours de retard
  const atNext=Math.max(0,o.est-M*Math.max(0,n-now)/(30*DAY)),need=H>n?M*(H-n)/(30*DAY):0;o.sug=Math.max(0,Math.round(need-atNext));
  const cov=M>0?o.est/M*30:Infinity; // jours couverts (précis)
  // la pastille suit la colonne « À livrer » : OK = rien à livrer, Limite = la prochaine livraison doit apporter des bacs
  if(o.est<=0||cov<dn)o.c="r";else if(bacs(o.sug)>0)o.c="a";else if(cov>dn+2*D.dd+MARGE_J||o.c==="o")o.c="o";else o.c="g";
  return o}
const bacs=n=>Math.round(Math.max(0,n)/BAC); // commande arrondie au bac le plus proche

  const sy=Object.values(syn).filter(s=>!fCol||s.cs[fCol]).sort((a,b)=>ORD[a.c]-ORD[b.c]||nm(a.p).localeCompare(nm(b.p),"fr"));

  (per==="fin"&&sy.length?(()=>{const tot=Object.values(syn).reduce((a,x)=>a+x.fs,0),C2=P(),fx=isFix(curP);return fx?`<div class="card"><b>Fin de trimestre</b><div class="sub" style="margin-top:4px">Les empanadas permanentes ★ n’ont pas de fin de trimestre.</div></div>`:`<div class="card" style="border-left:4px solid var(--${tot>0?"r":"g"})"><b>D’ici la fin du trimestre (${fd(Date.parse(C2.end+"T00:00:00"))})</b><div style="font-size:20px;margin-top:6px;color:var(--${tot>0?"r":"g"})"><b>${tot>0?`${tot} empanadas à commander`:"Rien à commander"}</b>${tot>0?` <span class="sub">(${fb(tot)})</span>`:""}</div><div class="sub" style="margin-top:6px">Calcul : ventes moyennes prévues jusqu’à la fin du trimestre − stock estimé aujourd’hui, restaurant par restaurant${fStore?"":" (le surplus d’un resto ne compense pas le manque d’un autre)"}. Si une empanada continue dans le trimestre suivant, le calcul va jusqu’à la fin de celui-ci.</div></div>`})():"")+
  (sy.length?(()=>{const fl=base.length&&base.every(x=>!x.r||x.k.dupM),finL=fl?"Fin du trimestre":"Fin du mois",dE=fl?fdd(Date.parse(P().end+"T00:00:00")):"",anyD=sy.some(s=>s.nd);
  return `<div class="card"><b>Synthèse par produit</b><div class="syn"><div class="sh"><div>Produit</div><div>Stock</div><div>Rupture</div><div>Prochaine livraison</div><div>À livrer</div><div>${finL}${dE?`<div class="sub">${dE}</div>`:""}</div></div>${sy.map(s=>{const g=s.mg,op=fOpen&&fOpen===s.ref;

<li><b>Stock</b> : stock estimé aujourd’hui.</li><li><b>Rupture</b> : période où le stock sera épuisé si rien n’est livré : au plus tôt (si les ventes suivent la semaine la plus forte des 4 retenues) et au plus tard (la plus faible).</li>

<div class="sub">Fin du trimestre : on ne livre jamais au-delà, pour que le stock soit bas à la fin. Les empanadas permanentes ★ n’ont pas de fin de trimestre.</div></details><div class="sub" style="margin-top:8px">Touchez un produit pour voir son détail par restaurant.${anyD?"":" Réglez les livraisons dans Gestion › Livraison pour voir la prochaine livraison et la commande à faire."}</div></div>`})():`<div class="card">Aucun produit à afficher.</div>`);

let vStore="";const REL={};

const fdd=t=>new Date(t).toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"});
// Semaine du lundi au dimanche, avec l'année (ex. 26/10 → 01/11/2026 ; 29/12/2025 → 04/01/2026)
const fwk=(s,e)=>{const a=new Date(s),b=new Date(e),y=t=>new Date(t).toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"numeric"});return (a.getFullYear()===b.getFullYear()?fdd(s):y(s))+" → "+y(e)};
function ventes(){

  const inPer=(st,pid)=>Object.values(S.lines).some(l=>inP(l)&&l.store===st&&l.ref===pid);
  const stl=stSorted().filter(([id])=>Object.keys(S.pos).some(k=>k.startsWith(id+"__")&&inPer(id,k.split("__")[1])));
  if(!stl.length)return `<div class="card">Aucune empanada du trimestre « ${esc(P().name)} » n’est reliée à Yokitup pour l’instant.</div>`;

  if(!(vs in REL)){REL[vs]=null;loadRel(vs)}
  const items=Object.entries(S.pos).filter(([k])=>k.startsWith(vs+"__")&&inPer(vs,k.split("__")[1])).map(([k,p])=>({pid:k.split("__")[1],p,st:wkStats(p,pal(vs))})).filter(x=>S.products[x.pid]).sort((a,b)=>nm(S.products[a.pid]).localeCompare(nm(S.products[b.pid]),"fr"));

    return s.avg!=null?`<div>${h}<b>${bx(s.avg)}</b><div class="sub">${Math.round(s.avg)} emp. · ${bx(s.wk)}/sem${s.few?` · <span style="color:var(--a)">peu de ventes</span>`:""}</div></div>`:`<div>${h}<span class="sub">aucune vente</span></div>`};

      const row=w=>`<tr><td>${fwk(w.start,w.start+6*DAY)}<div style="margin-top:3px">${tag(w)}</div></td><td style="text-align:right">${bx(w.total)}<div class="sub">${Math.round(w.total)} emp.</div></td></tr>`;
      return `<div class="sub" style="margin-top:10px"><b>Semaines</b> : les 12 dernières${old.length?`, puis les semaines plus anciennes utilisées dans la moyenne`:""}</div><div class="x"><table><tr><th>Semaine</th><th style="text-align:right">Ventes</th></tr>${rec.slice().reverse().map(row).join("")}${old.length?`<tr><td colspan="2" class="sub" style="text-align:center">··· semaines plus anciennes retenues ···</td></tr>${old.map(row).join("")}`:""}</table></div>`})()}

}

const PR={cur:null,hist:null,q:"",multi:true,per:"3m",from:"",to:"",mode:"var",sort:"vdesc",vg:"all",sup:"",tag:"",loading:false}; // mode : "var" = variations des articles (par défaut), "comp" = comparateur fournisseurs
async function selAll(t,cols){const out=[];for(let i=0;;i+=1000){const {data,error}=await sb.from(t).select(cols).range(i,i+999);if(error)throw error;out.push(...(data||[]));if(!data||data.length<1000)return out}}
async function loadPrix(){if(PR.loading)return;PR.loading=true;
  try{const [c,hh]=await Promise.all([selAll("stk_price_current","*"),selAll("stk_price_history","supplier_product_id,at,unit_price,price_per_unit")]);PR.cur=c;PR.hist=hh}
  catch(e){PR.cur=[];PR.hist=[];flash("Prix indisponibles : "+(e.message||"erreur"))}PR.loading=false;render(true)}
const eur=n=>n==null||isNaN(n)?"—":Number(n).toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})+"\u00a0€";
const pct=v=>(v>0?"+":"")+f1(v*100)+" %";
// Variation du tarif d'un article sur la fenêtre choisie : tarif actuel vs dernier tarif connu au début de la fenêtre
// Période d'observation des variations : semaine, mois, personnalisée…
const PERS=[["sem","Cette semaine"],["semp","La semaine dernière"],["mois","Ce mois-ci"],["moisp","Le mois dernier"],["3m","Les 3 derniers mois"],["tout","Depuis le 1er septembre"],["perso","Dates au choix"]];
function prRange(){const now=new Date(),d0=new Date(now.getFullYear(),now.getMonth(),now.getDate()),dow=(d0.getDay()+6)%7,mon=new Date(d0.getTime()-dow*DAY),E=t=>t+DAY-1;

  case"mois":return[new Date(now.getFullYear(),now.getMonth(),1).getTime(),now.getTime()];

// pour afficher le tableau de bord tout de suite à l'ouverture suivante, puis il est rafraîchi.
async function fetchRaw(){
  const q=t=>sb.from(t).select("*");
  const reqs=[q("stk_stores"),q("stk_products"),q("stk_lines"),q("stk_periods"),q("stk_latest_readings"),q("stk_obs"),q("stk_weekly"),sb.from("stk_yk_state").select("last_sync,last_error,stats").eq("id",1).maybeSingle()];
  if(isOwner)reqs.push(sb.from("stk_profiles").select("id,name,role"),q("stk_requests"),sb.from("stk_lab_suppliers").select("name"));
  const r=await Promise.all(reqs);
  const bad=r.slice(0,4).find(x=>x.error);if(bad)return {err:bad.error.message};
  const d=r.map(x=>x.data);
  return {st:d[0],pr:d[1],ln:d[2],pe:d[3],rd:d[4],ob:d[5],po:d[6],ys:d[7],pf:d[8],rq:d[9],ls:d[10]};
}
function applyRaw(R){
  S.stores=Object.fromEntries(R.st.map(r=>[r.id,{name:r.name,min:Number(r.min_month)||0,dd:Number(r.delivery_days)||0,last:r.last_delivery||""}]));
  S.products=Object.fromEntries(R.pr.map(r=>[r.id,{name:r.name,key:r.key}]));
  S.lines=Object.fromEntries(R.ln.map(r=>[r.id,{period:r.period_id,store:r.store_id,ref:r.product_id,group:r.grp,monthly:Number(r.monthly)}]));
  S.periods=Object.fromEntries(R.pe.map(r=>[r.id,{name:r.name,end:r.end_date,launch:r.launch_date,cover:Number(r.cover),fixed:r.fixed===true}]));
  for(const l of Object.values(S.lines))l.group=isFix(l.period)?"perm":"per"; // ★ fixe : couverture du stock ; saisonnière : stock bas à la fin du trimestre
  S.pos=Object.fromEntries((R.po||[]).map(r=>[r.store_id+"__"+r.product_id,{weeks:(r.weeks||[]).map(Number),first:Date.parse(r.first_week+"T00:00:00")}]));
  // Stock Yokitup inchangé depuis le dernier relevé : il reste valable jusqu'à la dernière synchro
  S.ykState=R.ys||null;
  const ls=R.ys&&R.ys.last_sync?Date.parse(R.ys.last_sync):0;
  ykOk=!!ls&&!R.ys.last_error&&Date.now()-ls<YK_OK_H*36e5;
  S.readings=(R.rd||[]).map(r=>{const ts=Date.parse(r.created_at),y=r.source==="yokitup"&&S.pos[r.store_id+"__"+r.product_id];
    return {store:r.store_id,ref:r.product_id,qty:Math.max(0,Number(r.qty)||0) /* stock négatif affiché à 0 */,ts:y&&ls>ts?ls:ts,by:r.source==="import"?"import":r.source==="yokitup"?"yokitup":r.user_id}});
  S.obs=Object.fromEntries((R.ob||[]).map(r=>[r.store_id+"__"+r.product_id,{sold:Number(r.sold),days:Number(r.days)}]));
  if(isOwner&&R.pf){
    S.labSup=(R.ls||[]).map(r=>r.name).sort((a,b)=>a.localeCompare(b,"fr"));
    S.members=R.pf||[];S.members.forEach(p=>S.names[p.id]=p.name||"Collaborateur");S.requests=R.rq||[];
  }
}
